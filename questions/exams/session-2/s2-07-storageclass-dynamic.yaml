id: "s2-07-storageclass-dynamic"
title: "StorageClass and Dynamic Provisioning"
category: "Storage"
difficulty: "medium"
weight: 6
context: "kind-cka-s2-cluster1"
task: |
  Create a StorageClass named `fast-storage` with the following specifications:
  - Provisioner: `kubernetes.io/no-provisioner`
  - Reclaim Policy: `Retain`
  - Volume Binding Mode: `WaitForFirstConsumer` (optional but recommended)

  Then create a PersistentVolumeClaim named `fast-pvc` that uses this StorageClass with a request of 2Gi.
setup: []
validation:
  - description: "StorageClass fast-storage exists"
    command: "kubectl get storageclass fast-storage -o jsonpath='{.metadata.name}'"
    expect: "fast-storage"
    match: "exact"
  - description: "Provisioner is set correctly"
    command: "kubectl get storageclass fast-storage -o jsonpath='{.provisioner}'"
    expect: "kubernetes.io/no-provisioner"
    match: "exact"
  - description: "Reclaim policy is Retain"
    command: "kubectl get storageclass fast-storage -o jsonpath='{.reclaimPolicy}'"
    expect: "Retain"
    match: "exact"
  - description: "PVC fast-pvc exists"
    command: "kubectl get pvc fast-pvc -o jsonpath='{.metadata.name}'"
    expect: "fast-pvc"
    match: "exact"
  - description: "PVC uses fast-storage StorageClass"
    command: "kubectl get pvc fast-pvc -o jsonpath='{.spec.storageClassName}'"
    expect: "fast-storage"
    match: "exact"
hint: |
  - StorageClass is cluster-scoped
  - Provisioner and reclaimPolicy are required fields
  - PVC references StorageClass by name
  - For Kind cluster, use no-provisioner
solution: |
  # Create StorageClass
  cat <<'EOF' | kubectl apply -f -
  apiVersion: storage.k8s.io/v1
  kind: StorageClass
  metadata:
    name: fast-storage
  provisioner: kubernetes.io/no-provisioner
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  EOF

  # Create PersistentVolumeClaim
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: fast-pvc
  spec:
    accessModes:
    - ReadWriteOnce
    storageClassName: fast-storage
    resources:
      requests:
        storage: 2Gi
  EOF
