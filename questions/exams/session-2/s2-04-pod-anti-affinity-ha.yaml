id: "s2-04-pod-anti-affinity-ha"
title: "Pod Anti-Affinity for High Availability"
category: "Pod Scheduling"
difficulty: "medium"
weight: 6
context: "kind-cka-s2-cluster1"
task: |
  Create a Deployment named `ha-webapp` with the following specifications:
  - Image: `nginx:1.24`
  - Replicas: 2
  - Label: `app: ha-webapp`
  - Pod anti-affinity: requiredDuringSchedulingIgnoredDuringExecution using `kubernetes.io/hostname`

  The pod anti-affinity should ensure that no two replicas of this Deployment are scheduled on the same node.
setup: []
validation:
  - description: "Deployment ha-webapp exists"
    command: "kubectl get deployment ha-webapp -o jsonpath='{.metadata.name}'"
    expect: "ha-webapp"
    match: "exact"
  - description: "Deployment has 2 replicas"
    command: "kubectl get deployment ha-webapp -o jsonpath='{.spec.replicas}'"
    expect: "2"
    match: "exact"
  - description: "Pod anti-affinity is configured"
    command: "kubectl get deployment ha-webapp -o jsonpath='{.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey}'"
    expect: "kubernetes.io/hostname"
    match: "exact"
  - description: "Pods are on different nodes"
    command: "kubectl get pods -l app=ha-webapp -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\\n' | sort -u | wc -l | tr -d ' '"
    expect: "^[1-9]"
    match: "regex"
hint: |
  - Use `requiredDuringSchedulingIgnoredDuringExecution` for pod anti-affinity
  - Set labelSelector with matchLabels `app: ha-webapp`
  - Use topologyKey `kubernetes.io/hostname` for node-level spreading
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ha-webapp
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: ha-webapp
    template:
      metadata:
        labels:
          app: ha-webapp
      spec:
        containers:
        - name: nginx
          image: nginx:1.24
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ha-webapp
              topologyKey: kubernetes.io/hostname
  EOF
