id: "s2-16-deployment-rolling-update"
title: "Deployment Rolling Update Strategy"
category: "Deployment Management"
difficulty: "easy"
weight: 5
context: "kind-cka-s2-cluster1"
task: |
  Create a Deployment named `zero-downtime-app` with the following specifications:
  - Image: `nginx:1.24`
  - Replicas: 3
  - Rolling update strategy:
    - maxSurge: 1 (allows 1 extra pod during update)
    - maxUnavailable: 0 (ensures zero downtime)

  The deployment should ensure that during updates, there is always at least 3 pods available.
setup: []
validation:
  - description: "Deployment zero-downtime-app exists"
    command: "kubectl get deployment zero-downtime-app -o jsonpath='{.metadata.name}'"
    expect: "zero-downtime-app"
    match: "exact"
  - description: "Deployment has 3 replicas"
    command: "kubectl get deployment zero-downtime-app -o jsonpath='{.spec.replicas}'"
    expect: "3"
    match: "exact"
  - description: "maxSurge is 1"
    command: "kubectl get deployment zero-downtime-app -o jsonpath='{.spec.strategy.rollingUpdate.maxSurge}'"
    expect: "1"
    match: "exact"
  - description: "maxUnavailable is 0"
    command: "kubectl get deployment zero-downtime-app -o jsonpath='{.spec.strategy.rollingUpdate.maxUnavailable}'"
    expect: "0"
    match: "exact"
hint: |
  - Use strategy.type: RollingUpdate (default)
  - maxSurge is the maximum number of extra pods allowed
  - maxUnavailable is the maximum number of pods that can be unavailable
  - For zero downtime, set maxUnavailable to 0
solution: |
  cat <<'EOF' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: zero-downtime-app
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: zero-downtime-app
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    template:
      metadata:
        labels:
          app: zero-downtime-app
      spec:
        containers:
        - name: nginx
          image: nginx:1.24
  EOF
