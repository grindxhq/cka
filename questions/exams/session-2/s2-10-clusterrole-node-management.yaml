id: "s2-10-clusterrole-node-management"
title: "ClusterRole - Node Management"
category: "RBAC"
difficulty: "medium"
weight: 6
context: "kind-cka-s2-cluster1"
task: |
  Create a ClusterRole named `node-reader` with permissions to:
  - get nodes
  - list nodes
  - watch nodes

  Create a ServiceAccount named `node-viewer` in the `default` namespace.

  Create a ClusterRoleBinding that binds the `node-reader` ClusterRole to the `node-viewer` ServiceAccount.
setup: []
validation:
  - description: "ClusterRole node-reader exists"
    command: "kubectl get clusterrole node-reader -o jsonpath='{.metadata.name}'"
    expect: "node-reader"
    match: "exact"
  - description: "ClusterRole has node get permission"
    command: "kubectl get clusterrole node-reader -o jsonpath='{.rules[?(@.verbs[*]==\"get\")].resources[0]}' | grep -c node"
    expect: "1"
    match: "contains"
  - description: "ServiceAccount node-viewer exists"
    command: "kubectl get sa node-viewer -o jsonpath='{.metadata.name}'"
    expect: "node-viewer"
    match: "exact"
  - description: "ClusterRoleBinding exists"
    command: "kubectl get clusterrolebinding node-viewer-binding -o jsonpath='{.metadata.name}'"
    expect: "node-viewer-binding"
    match: "exact"
hint: |
  - ClusterRole and ClusterRoleBinding are cluster-scoped
  - Verbs: "get", "list", "watch"
  - Resource is "nodes"
  - ClusterRoleBinding references the ClusterRole by name
solution: |
  # Create ClusterRole
  cat <<'EOF' | kubectl apply -f -
  apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRole
  metadata:
    name: node-reader
  rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  EOF

  # Create ServiceAccount
  kubectl create serviceaccount node-viewer

  # Create ClusterRoleBinding
  cat <<'EOF' | kubectl apply -f -
  apiVersion: rbac.authorization.k8s.io/v1
  kind: ClusterRoleBinding
  metadata:
    name: node-viewer-binding
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: node-reader
  subjects:
  - kind: ServiceAccount
    name: node-viewer
    namespace: default
  EOF
