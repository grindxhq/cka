id: "s4-09-rbac-serviceaccount"
title: "RBAC - ServiceAccount Can't List Pods"
category: "Security & RBAC"
difficulty: "hard"
weight: 8
context: "kind-cka-s4-cluster1"
task: |
  A ServiceAccount "app-sa" has been created, and a pod is using it, but the ServiceAccount has no permissions to access the Kubernetes API.

  Your task is to:
  1. Create a Role that grants permissions to list pods
  2. Create a RoleBinding to bind the Role to the ServiceAccount
  3. Verify the ServiceAccount can now access the API

  The Role should allow:
  - pods: list, get, watch
  - pods/log: get

  Requirements:
  - Role name: "app-role"
  - RoleBinding name: "app-rolebinding"
setup:
  - "kubectl create namespace rbac-test"
  - "kubectl create serviceaccount app-sa -n rbac-test"
  - "kubectl apply -f - <<EOF\napiVersion: v1\nkind: Pod\nmetadata:\n  name: app-pod\n  namespace: rbac-test\nspec:\n  serviceAccountName: app-sa\n  containers:\n  - name: app\n    image: curlimages/curl\n    command: [\"/bin/sh\", \"-c\", \"sleep 3600\"]\nEOF"
  - "sleep 2"
validation:
  - description: "Role app-role exists"
    command: "kubectl get role app-role -n rbac-test -o jsonpath='{.metadata.name}'"
    expect: "app-role"
    match: "exact"
  - description: "RoleBinding app-rolebinding exists"
    command: "kubectl get rolebinding app-rolebinding -n rbac-test -o jsonpath='{.metadata.name}'"
    expect: "app-rolebinding"
    match: "exact"
  - description: "Role has pods permissions"
    command: "kubectl get role app-role -n rbac-test -o jsonpath='{.rules[0].verbs[*]}' | grep -q list && echo 'list' || echo 'none'"
    expect: "list"
    match: "exact"
hint: |
  1. Check ServiceAccount: `kubectl get serviceaccount app-sa -n rbac-test`
  2. Create a Role with pod list permissions
  3. Create a RoleBinding linking Role to ServiceAccount
  4. Verify with: `kubectl auth can-i list pods --as=system:serviceaccount:rbac-test:app-sa -n rbac-test`
solution: |
  # Step 1: Check ServiceAccount
  kubectl get serviceaccount app-sa -n rbac-test

  # Step 2: Create Role
  cat <<EOF | kubectl apply -f -
  apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: app-role
    namespace: rbac-test
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["list", "get", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]
  EOF

  # Step 3: Create RoleBinding
  cat <<EOF | kubectl apply -f -
  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: app-rolebinding
    namespace: rbac-test
  subjects:
    - kind: ServiceAccount
      name: app-sa
      namespace: rbac-test
  roleRef:
    kind: Role
    name: app-role
    apiGroup: rbac.authorization.k8s.io
  EOF

  # Step 4: Verify permissions
  kubectl get role app-role -n rbac-test
  kubectl get rolebinding app-rolebinding -n rbac-test
  kubectl auth can-i list pods --as=system:serviceaccount:rbac-test:app-sa -n rbac-test
