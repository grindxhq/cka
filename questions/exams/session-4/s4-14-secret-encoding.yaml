id: "s4-14-secret-encoding"
title: "Secret Encoding Issue"
category: "Secret Management"
difficulty: "medium"
weight: 6
context: "kind-cka-s4-cluster2"
task: |
  You need to create a Secret with specific values and mount it in a pod.

  Your task is to:
  1. Create a Secret named "app-secret" with the following data:
     - username: "admin"
     - password: "secret123"
  2. Create a pod that mounts the secret as environment variables
  3. Verify the pod is running and can access the secret values

  Note: Kubernetes secrets are base64-encoded, but you can use stringData to avoid manual encoding.
setup:
  - "sleep 1"
validation:
  - description: "Secret app-secret exists"
    command: "kubectl get secret app-secret -n default -o jsonpath='{.metadata.name}'"
    expect: "app-secret"
    match: "exact"
  - description: "Secret has required keys"
    command: "kubectl get secret app-secret -n default -o jsonpath='{.data.username}'"
    expect: ".+"
    match: "regex"
  - description: "Pod mounting secret exists"
    command: "kubectl get pod secret-consumer -n default -o jsonpath='{.metadata.name}'"
    expect: "secret-consumer"
    match: "exact"
  - description: "Pod is running"
    command: "kubectl get pod secret-consumer -n default -o jsonpath='{.status.phase}'"
    expect: "Running"
    match: "exact"
hint: |
  1. Create a secret with stringData: `kubectl create secret generic app-secret --from-literal=username=admin --from-literal=password=secret123`
  2. Create a pod that mounts the secret as environment variables
  3. Use envFrom with secretRef
  4. Verify the pod is running
solution: |
  # Step 1: Create the Secret
  kubectl create secret generic app-secret --from-literal=username=admin --from-literal=password=secret123 -n default

  # Or with YAML using stringData
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Secret
  metadata:
    name: app-secret
    namespace: default
  type: Opaque
  stringData:
    username: admin
    password: secret123
  EOF

  # Step 2: Create pod that mounts the secret
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: secret-consumer
    namespace: default
  spec:
    containers:
      - name: app
        image: nginx
        envFrom:
          - secretRef:
              name: app-secret
  EOF

  # Step 3: Verify secret and pod
  kubectl get secret app-secret -n default
  kubectl get pod secret-consumer -n default
  kubectl describe pod secret-consumer -n default
