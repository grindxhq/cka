id: "s1-06-secret-volume-mounts"
title: "Secret and Volume Mounts"
category: "Core Concepts"
difficulty: "medium"
weight: 5
context: "kind-cka-s1-cluster2"

task: |
  Create a Secret named `db-credentials` with the following data:
  - username=admin
  - password=SuperSecret123

  Then create a Pod named `app-with-secret` with:
  - **Image:** nginx:1.24
  - **Mount the secret at /etc/secrets**
  - The secret keys should be accessible as files in the mounted directory

  Verify the secret files are mounted and readable in the Pod.

setup: []

validation:
  - description: "Secret db-credentials exists"
    command: "kubectl get secret db-credentials -o jsonpath='{.metadata.name}'"
    expect: "db-credentials"
    match: "exact"
  - description: "Secret has username"
    command: "kubectl get secret db-credentials -o jsonpath='{.data.username}' | base64 -d"
    expect: "admin"
    match: "exact"
  - description: "Secret has password"
    command: "kubectl get secret db-credentials -o jsonpath='{.data.password}' | base64 -d"
    expect: "SuperSecret123"
    match: "exact"
  - description: "Pod app-with-secret exists"
    command: "kubectl get pod app-with-secret -o jsonpath='{.metadata.name}'"
    expect: "app-with-secret"
    match: "exact"
  - description: "Pod is running"
    command: "kubectl get pod app-with-secret -o jsonpath='{.status.phase}'"
    expect: "Running"
    match: "exact"
  - description: "Pod mounts secret volume"
    command: "kubectl get pod app-with-secret -o jsonpath='{.spec.volumes[0].secret.secretName}'"
    expect: "db-credentials"
    match: "exact"
  - description: "Pod mounts at /etc/secrets"
    command: "kubectl get pod app-with-secret -o jsonpath='{.spec.containers[0].volumeMounts[0].mountPath}'"
    expect: "/etc/secrets"
    match: "exact"

hint: |
  Create a Secret with kubectl create secret generic db-credentials --from-literal=username=admin --from-literal=password=SuperSecret123
  Create a Pod manifest with spec.volumes[0].secret.secretName set to db-credentials.
  Mount the volume in the container with volumeMounts at /etc/secrets.
  Secret keys appear as files in the mounted directory.

solution: |
  kubectl create secret generic db-credentials \
    --from-literal=username=admin \
    --from-literal=password=SuperSecret123

  cat > app-with-secret.yaml << 'EOF'
  apiVersion: v1
  kind: Pod
  metadata:
    name: app-with-secret
  spec:
    containers:
    - name: app
      image: nginx:1.24
      volumeMounts:
      - name: secret-volume
        mountPath: /etc/secrets
        readOnly: true
    volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
  EOF

  kubectl apply -f app-with-secret.yaml
  kubectl get pod app-with-secret
