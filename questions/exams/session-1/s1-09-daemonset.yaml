id: "s1-09-daemonset"
title: "DaemonSet"
category: "Workloads"
difficulty: "medium"
weight: 5
context: "kind-cka-s1-cluster1"

task: |
  Create a DaemonSet named `node-monitor` with the following specifications:
  - **Image:** busybox:1.36
  - **Command:** Prints the hostname every 30 seconds
  - **Label:** app=node-monitor
  - **Node Selector:** Must run only on worker nodes, not the control-plane node

  Verify the DaemonSet is running on all worker nodes.

setup: []

validation:
  - description: "DaemonSet node-monitor exists"
    command: "kubectl get daemonset node-monitor -o jsonpath='{.metadata.name}'"
    expect: "node-monitor"
    match: "exact"
  - description: "DaemonSet has label app=node-monitor"
    command: "kubectl get daemonset node-monitor -o jsonpath='{.spec.selector.matchLabels.app}'"
    expect: "node-monitor"
    match: "exact"
  - description: "DaemonSet image is busybox:1.36"
    command: "kubectl get daemonset node-monitor -o jsonpath='{.spec.template.spec.containers[0].image}'"
    expect: "busybox:1.36"
    match: "exact"
  - description: "DaemonSet pods are running"
    command: "kubectl get pod -l app=node-monitor --field-selector=status.phase=Running --no-headers | grep -c node-monitor || true"
    expect: "^[1-9]"
    match: "regex"
  - description: "DaemonSet has node affinity to exclude control-plane"
    command: "kubectl get daemonset node-monitor -o jsonpath='{.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key}'"
    expect: "node-role.kubernetes.io/control-plane"
    match: "exact"

hint: |
  Create a DaemonSet manifest with kind: DaemonSet.
  Use a nodeAffinity with requiredDuringSchedulingIgnoredDuringExecution to exclude control-plane nodes.
  Set the command to: sh -c 'while true; do echo "Node: $(hostname)"; sleep 30; done'
  DaemonSet ensures one Pod runs on each matching node.

solution: |
  cat <<EOF | kubectl apply -f -
  apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: node-monitor
  spec:
    selector:
      matchLabels:
        app: node-monitor
    template:
      metadata:
        labels:
          app: node-monitor
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
        containers:
        - name: monitor
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do echo Node: \$(hostname); sleep 30; done"]
  EOF
  sleep 5
  kubectl get daemonset node-monitor
  kubectl get pod -l app=node-monitor
