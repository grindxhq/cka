id: "s1-08-node-selector-scheduling"
title: "Node Selector Scheduling"
category: "Scheduling"
difficulty: "easy"
weight: 4
context: "kind-cka-s1-cluster1"

task: |
  Label one of the worker nodes with the label `disktype=ssd`, then create a Pod named `cache-pod` with the following:
  - **Image:** redis:7
  - **Node Selector:** disktype=ssd (Pod should only run on the labeled worker node)

  Verify the Pod is scheduled and running on the correct node.

setup: []

validation:
  - description: "A worker node has disktype=ssd label"
    command: "kubectl get nodes -L disktype | grep ssd | grep -v control-plane | wc -l"
    expect: "1"
    match: "exact"
  - description: "Pod cache-pod exists"
    command: "kubectl get pod cache-pod -o jsonpath='{.metadata.name}'"
    expect: "cache-pod"
    match: "exact"
  - description: "Pod is running"
    command: "kubectl get pod cache-pod -o jsonpath='{.status.phase}'"
    expect: "Running"
    match: "exact"
  - description: "Pod image is redis:7"
    command: "kubectl get pod cache-pod -o jsonpath='{.spec.containers[0].image}'"
    expect: "redis:7"
    match: "exact"
  - description: "Pod has nodeSelector disktype=ssd"
    command: "kubectl get pod cache-pod -o jsonpath='{.spec.nodeSelector.disktype}'"
    expect: "ssd"
    match: "exact"
  - description: "Pod is scheduled on labeled node"
    command: "kubectl get pod cache-pod -o jsonpath='{.status.hostIP}' | grep -E '^[0-9.]+'  && echo 'true'"
    expect: "true"
    match: "contains"

hint: |
  First, get the list of worker nodes: kubectl get nodes
  Label a worker node with: kubectl label nodes <worker-node> disktype=ssd
  Create a Pod manifest with spec.nodeSelector.disktype: ssd
  This ensures the Pod only runs on nodes with that label.

solution: |
  # Label a worker node with disktype=ssd
  kubectl label nodes $(kubectl get nodes --no-headers -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[0].metadata.name}') disktype=ssd

  # Create the pod with nodeSelector
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: cache-pod
  spec:
    nodeSelector:
      disktype: ssd
    containers:
    - name: cache
      image: redis:7
  EOF
  kubectl wait --for=condition=Ready pod/cache-pod --timeout=60s
