id: "s1-03-multi-container-pod"
title: "Multi-Container Pod"
category: "Workloads"
difficulty: "medium"
weight: 5
context: "kind-cka-s1-cluster2"

task: |
  Create a Pod named `data-processor` with two containers and a shared volume:
  - **Writer container:** busybox:1.36, writes a timestamp to `/data/log.txt` every 5 seconds
  - **Reader container:** busybox:1.36, continuously tails (follows) `/data/log.txt`
  - **Shared volume:** emptyDir named `shared-data` mounted at `/data` in both containers
  - **Label:** app=data-processor

  Verify both containers are running and the log is being written and read.

setup: []

validation:
  - description: "Pod data-processor exists"
    command: "kubectl get pod data-processor -o jsonpath='{.metadata.name}'"
    expect: "data-processor"
    match: "exact"
  - description: "Pod has label app=data-processor"
    command: "kubectl get pod data-processor -o jsonpath='{.metadata.labels.app}'"
    expect: "data-processor"
    match: "exact"
  - description: "Pod has 2 containers"
    command: "kubectl get pod data-processor -o jsonpath='{.spec.containers[*].name}' | wc -w | tr -d ' '"
    expect: "2"
    match: "exact"
  - description: "Writer container uses busybox:1.36"
    command: "kubectl get pod data-processor -o jsonpath='{.spec.containers[0].image}'"
    expect: "busybox:1.36"
    match: "exact"
  - description: "Reader container uses busybox:1.36"
    command: "kubectl get pod data-processor -o jsonpath='{.spec.containers[1].image}'"
    expect: "busybox:1.36"
    match: "exact"
  - description: "Pod has emptyDir volume"
    command: "kubectl get pod data-processor -o jsonpath='{.spec.volumes[0].emptyDir}'"
    expect: "{}"
    match: "exact"
  - description: "Pod is running"
    command: "kubectl get pod data-processor -o jsonpath='{.status.phase}'"
    expect: "Running"
    match: "exact"

hint: |
  Create a multi-container Pod manifest with spec.containers as an array of 2 containers.
  For the writer, use command: [sh, -c, 'while true; do echo $(date) >> /data/log.txt; sleep 5; done']
  For the reader, use command: [sh, -c, 'tail -f /data/log.txt']
  Add spec.volumes with emptyDir and mount it at /data in both containers via volumeMounts.

solution: |
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: data-processor
    labels:
      app: data-processor
  spec:
    volumes:
    - name: shared-data
      emptyDir: {}
    containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do date >> /data/log.txt; sleep 5; done"]
      volumeMounts:
      - name: shared-data
        mountPath: /data
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "tail -f /data/log.txt"]
      volumeMounts:
      - name: shared-data
        mountPath: /data
  EOF
  kubectl wait --for=condition=Ready pod/data-processor --timeout=60s
