id: "s5-16-kubeconfig-context"
title: "Manage Kubeconfig Contexts"
category: "Cluster Architecture"
difficulty: "medium"
weight: 5
context: "kind-cka-s5-cluster1"
task: |
  Work with kubeconfig to manage cluster access:

  1. List all available contexts and save the output to `/tmp/contexts.txt`
  2. Create a new context named `restricted-context` that uses:
     - The existing cluster `kind-cka-s5-cluster1`
     - The existing user `kind-cka-s5-cluster1`
     - Namespace `kube-system`
  3. Verify the new context exists with `kubectl config get-contexts`
setup:
  - "sleep 1"
validation:
  - description: "Contexts file exists"
    command: "test -f /tmp/contexts.txt && echo 'exists'"
    expect: "exists"
    match: "exact"
  - description: "New context exists"
    command: "kubectl config get-contexts restricted-context -o name 2>/dev/null || kubectl config get-contexts -o name | grep restricted-context"
    expect: "restricted-context"
    match: "contains"
  - description: "Context has correct namespace"
    command: "kubectl config view -o jsonpath='{.contexts[?(@.name==\"restricted-context\")].context.namespace}'"
    expect: "kube-system"
    match: "exact"
hint: |
  1. `kubectl config get-contexts > /tmp/contexts.txt`
  2. `kubectl config set-context restricted-context --cluster=kind-cka-s5-cluster1 --user=kind-cka-s5-cluster1 --namespace=kube-system`
  3. `kubectl config get-contexts`
solution: |
  # Step 1: List contexts
  kubectl config get-contexts > /tmp/contexts.txt
  cat /tmp/contexts.txt

  # Step 2: Create new context
  kubectl config set-context restricted-context \
    --cluster=kind-cka-s5-cluster1 \
    --user=kind-cka-s5-cluster1 \
    --namespace=kube-system

  # Step 3: Verify
  kubectl config get-contexts
