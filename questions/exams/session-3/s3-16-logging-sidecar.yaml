id: "s3-16-logging-sidecar"
title: "Multi-container Logging Sidecar"
category: "workloads"
difficulty: "medium"
weight: 6
context: "kind-cka-s3-cluster2"
task: |
  Create a pod named `app-with-logger` in the default namespace with two containers:
  - Main container: nginx:1.24 (named "app")
  - Sidecar container: busybox:1.36 (named "logger") that continuously reads and tails the nginx access log

  The sidecar should use tail -f /var/log/nginx/access.log (or similar) to stream logs.

  Both containers should share the /var/log/nginx volume for log access.
setup: []
validation:
  - description: "Pod exists"
    command: "kubectl -n default get pod app-with-logger"
    expect: "app-with-logger"
    match: "contains"
  - description: "Pod has 2 containers"
    command: "kubectl -n default get pod app-with-logger -o jsonpath='{.spec.containers[*].name}' | wc -w | tr -d ' '"
    expect: "2"
    match: "exact"
  - description: "Contains app container"
    command: "kubectl -n default get pod app-with-logger -o yaml"
    expect: "name: app"
    match: "contains"
  - description: "Contains logger container"
    command: "kubectl -n default get pod app-with-logger -o yaml"
    expect: "name: logger"
    match: "contains"
  - description: "Logger runs busybox"
    command: "kubectl -n default get pod app-with-logger -o yaml"
    expect: "busybox:1.36"
    match: "contains"
hint: |
  Create a pod with spec.containers array containing two container definitions.

  Both containers should mount the same emptyDir volume at /var/log/nginx.

  The logger container should use:
  - image: busybox:1.36
  - command: ["/bin/sh", "-c", "tail -f /var/log/nginx/access.log"]

  For nginx to work in this setup, you may need to configure it to write logs to /var/log/nginx/access.log.
solution: |
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: app-with-logger
    namespace: default
  spec:
    containers:
      - name: app
        image: nginx:1.24
        volumeMounts:
          - name: logs
            mountPath: /var/log/nginx
      - name: logger
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              if [ -f /var/log/nginx/access.log ]; then
                tail -f /var/log/nginx/access.log
              else
                sleep 1
              fi
            done
        volumeMounts:
          - name: logs
            mountPath: /var/log/nginx
    volumes:
      - name: logs
        emptyDir: {}
  EOF
