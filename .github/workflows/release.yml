name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: "grindx-cka.app"
          - os: windows-latest
            platform: windows/amd64
            artifact: "grindx-cka.exe"
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: "grindx-cka"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build
        run: wails build -platform ${{ matrix.platform }}

      # macOS: ad-hoc sign + create DMG
      - name: Sign and create DMG
        if: runner.os == 'macOS'
        run: |
          # Find the actual .app name (Wails uses the name from wails.json which may have spaces)
          APP_PATH=$(find build/bin -name "*.app" -maxdepth 1 | head -1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found app: $APP_PATH ($APP_NAME)"

          # Ad-hoc sign to reduce Gatekeeper severity
          codesign --force --deep --sign - "$APP_PATH"

          # Strip quarantine attribute
          xattr -cr "$APP_PATH"

          # Create a staging folder with just the .app
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/

          brew install create-dmg
          create-dmg \
            --volname "grindx cka" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 200 \
            --app-drop-link 425 200 \
            "grindx-cka-macos-universal.dmg" \
            "dmg-staging/" || true
          # create-dmg returns 1 if it can't find a signing identity, but the DMG is still created
          ls -la *.dmg

      # Windows: zip the exe
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/bin/grindx-cka.exe" -DestinationPath "grindx-cka-windows-amd64.zip"

      # Linux: tar the binary
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czvf grindx-cka-linux-amd64.tar.gz -C build/bin grindx-cka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            *.dmg
            *.zip
            *.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.tar.gz
